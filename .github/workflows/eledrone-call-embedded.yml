name: eledrone call embedded

# Builds the Element Call *widget* from this fork and publishes it as a release
# asset, for eledrone-web to embed.
#
#   pull request        -> build only, so a broken change is caught before merge
#   push to livekit     -> build only; livekit is the trunk, not production
#   push to main        -> build, publish a release, and open a PR on eledrone-web
#   manual dispatch     -> same as the branch it is run from
#
# This is a different artifact from the one eledrone-call.yml produces. That is
# the standalone server behind call.gandon.pp.ua; this is the bundle that runs
# inside an iframe in the desktop and web apps. Same source, independent
# lifetimes: upgrading one does not upgrade the other, and until this existed the
# apps ran upstream's widget no matter what the server was running.
#
# Published as a release asset rather than to a registry. eledrone-web then
# depends on a plain URL, which needs no token on CI or on anyone's machine, and
# both repositories are public. Publishing to npm is not an option - the package
# name belongs to Element - and GitHub Packages would mean an .npmrc credential
# everywhere the app is built.
#
# One release per commit, rather than a tag that moves. Same reasoning as pinning
# the server image by digest: a moving tag means the thing that was tested stops
# being the thing that runs. Upgrading element-web is therefore a commit that
# changes a URL, and that commit is the record of which widget it ships.
#
# That commit is now written for you: see bump-eledrone-web below, which opens it
# as a pull request. Merging it is still a decision someone makes.

on:
    pull_request:
    push:
        branches: [livekit, main]
        paths-ignore:
            - "**.md"
            - "docs/**"
    workflow_dispatch:

concurrency:
    group: eledrone-call-embedded-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write # creating the release
        outputs:
            short_sha: ${{ steps.name.outputs.short_sha }}
            version: ${{ steps.name.outputs.version }}
            tag: ${{ steps.name.outputs.tag }}
        steps:
            - uses: actions/checkout@v4

            - run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # --ignore-pnpmfile matches upstream's CI: a committed pnpmfile would
            # otherwise run during install.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-pnpmfile

            - name: Name this build
              id: name
              run: |
                  set -euo pipefail
                  short=$(git rev-parse --short HEAD)
                  echo "short_sha=$short" >> "$GITHUB_OUTPUT"
                  echo "version=0.0.0-eledrone.$short" >> "$GITHUB_OUTPUT"
                  echo "tag=embedded-$short" >> "$GITHUB_OUTPUT"

            - name: Build the widget
              env:
                  # Element Call prints this on startup and shows it in its About
                  # panel, so a console log says which widget is running. Worth
                  # having: telling our build from upstream's has already cost an
                  # afternoon once.
                  VITE_APP_VERSION: embedded-eledrone-${{ steps.name.outputs.short_sha }}
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm build:embedded

            - name: Assemble the npm package
              env:
                  VERSION: ${{ steps.name.outputs.version }}
              run: |
                  set -euo pipefail
                  # The build writes to ./dist; embedded/web is the package that
                  # ships it, and its `files` field expects dist/ beneath it.
                  rm -rf embedded/web/dist
                  cp -r dist embedded/web/dist
                  cd embedded/web
                  npm version "$VERSION" --no-git-tag-version
                  npm pack
                  ls -lh ./*.tgz

            - name: Checksum
              working-directory: embedded/web
              env:
                  VERSION: ${{ steps.name.outputs.version }}
              run: |
                  set -euo pipefail
                  # Named explicitly: a `*.tgz.sha256` glob has nothing to match
                  # yet, so it stays literal and the asset lands called "tgz.sha256".
                  tgz="element-hq-element-call-embedded-${VERSION}.tgz"
                  sha256sum "$tgz" | tee "${tgz}.sha256"

            # Everything below publishes, so pull requests and the trunk stop
            # here: those runs exist to prove the widget still builds.
            - name: Publish the release
              if: github.ref == 'refs/heads/main'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.name.outputs.tag }}
                  name: Element Call widget ${{ steps.name.outputs.short_sha }}
                  body: |
                      The Element Call widget built from this fork, for eledrone-web to embed.

                      Point `@element-hq/element-call-embedded` in `apps/web/package.json` at the
                      asset below, then run `pnpm install` to update the lockfile.
                  files: |
                      embedded/web/*.tgz
                      embedded/web/*.tgz.sha256

            - name: Where it went
              if: github.ref == 'refs/heads/main'
              env:
                  REPO: ${{ github.repository }}
                  TAG: ${{ steps.name.outputs.tag }}
                  VERSION: ${{ steps.name.outputs.version }}
              run: |
                  echo "### Widget published" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "\"@element-hq/element-call-embedded\": \"https://github.com/${REPO}/releases/download/${TAG}/element-hq-element-call-embedded-${VERSION}.tgz\"," >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    # Offer the new widget to eledrone-web as a pull request. Same shape as the
    # promote job in eledrone-call.yml - read a token from the vault, act on
    # another repository - except that this one opens a PR rather than pushing,
    # so the bump goes through eledrone-web's own CI before it lands on develop.
    #
    # A PR rather than a direct push because the widget is the app's largest
    # single dependency: if it breaks the call UI, that should surface on a
    # branch, not on the trunk everyone builds from.
    #
    # The URL cannot simply be sed'd everywhere: pnpm-lock.yaml pins the tarball
    # by sha512 integrity, which only pnpm can recompute. So this checks out
    # eledrone-web, rewrites package.json, and lets `pnpm install --lockfile-only`
    # fetch the freshly published release and write the real hash.
    bump-eledrone-web:
        needs: build
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
            PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        steps:
            # The vault listens on a tailnet address only, so this is how it is
            # reachable at all.
            - name: Join the tailnet
              uses: tailscale/github-action@v3
              with:
                  oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            # A token of its own rather than the one promote uses: two narrow
            # tokens mean a leak from either job reaches one repository, where a
            # single wide one would reach both - including matrix-infra, which is
            # the path to the server.
            - name: Read the eledrone-web token from the vault
              id: vault
              env:
                  INFISICAL_CLIENT_ID: ${{ vars.INFISICAL_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
                  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
              run: |
                  set -euo pipefail
                  url="${INFISICAL_URL%/}"; url="${url%/api}"

                  resp=$(curl -sS -m 30 -w '\n%{http_code}' -X POST \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg id "$INFISICAL_CLIENT_ID" --arg sec "$INFISICAL_CLIENT_SECRET" \
                          '{clientId:$id, clientSecret:$sec}')" \
                    "$url/api/v1/auth/universal-auth/login")
                  [ "$(printf '%s' "$resp" | tail -n1)" = "200" ] || { echo "vault login failed"; exit 1; }
                  token=$(printf '%s' "$resp" | sed '$d' | jq -r '.accessToken // empty')
                  [ -n "$token" ] || { echo "login returned no accessToken"; exit 1; }
                  echo "::add-mask::$token"

                  code=$(curl -sS -m 30 -o secrets.json -w '%{http_code}' \
                    -H "Authorization: Bearer $token" \
                    "$url/api/v3/secrets/raw?workspaceId=$PROJECT_ID&environment=prod&secretPath=%2F&recursive=true")
                  [ "$code" = "200" ] || { echo "fetching secrets failed: HTTP $code"; exit 1; }

                  gh_token=$(jq -r '.secrets[] | select(.secretKey == "GH_PAT_ELEDRONE_WEB") | .secretValue' secrets.json)
                  rm -f secrets.json
                  [ -n "$gh_token" ] || { echo "GH_PAT_ELEDRONE_WEB missing from the vault"; exit 1; }
                  echo "::add-mask::$gh_token"
                  echo "token=$gh_token" >> "$GITHUB_OUTPUT"

            # Cloned with the token in the URL rather than via actions/checkout,
            # so the credential is never written to a step input. Full history is
            # not needed; the PR branch starts from develop's tip.
            - name: Clone eledrone-web
              env:
                  GH_TOKEN: ${{ steps.vault.outputs.token }}
              run: |
                  set -euo pipefail
                  git clone --depth 1 -b develop \
                    "https://x-access-token:${GH_TOKEN}@github.com/eledrone/eledrone-web.git" web

            # eledrone-web pins its own Node version, which is not necessarily
            # this repository's. Reading it from the checkout keeps the two from
            # drifting into a lockfile written by the wrong version.
            - uses: actions/setup-node@v4
              with:
                  node-version-file: web/.node-version
            - run: corepack enable

            - name: Point the dependency at the new widget
              id: bump
              env:
                  REPO: ${{ github.repository }}
                  TAG: ${{ needs.build.outputs.tag }}
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  set -euo pipefail
                  cd web
                  url="https://github.com/${REPO}/releases/download/${TAG}/element-hq-element-call-embedded-${VERSION}.tgz"
                  echo "url=$url" >> "$GITHUB_OUTPUT"

                  # The release is public, so this needs no credential - but it
                  # has to exist before pnpm can hash it.
                  code=$(curl -sSL -o /dev/null -w '%{http_code}' -m 60 "$url" || echo 000)
                  [ "$code" = "200" ] || { echo "widget tarball not fetchable: HTTP $code"; exit 1; }

                  file=apps/web/package.json
                  # Rewrite only this one dependency's URL, whatever it points at
                  # now. The lockfile is left to pnpm: it carries an integrity
                  # hash that cannot be produced by substitution.
                  jq --arg url "$url" \
                    '.devDependencies["@element-hq/element-call-embedded"] = $url' \
                    "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                  grep -q "$TAG" "$file" || { echo "dependency line was not updated"; exit 1; }

                  if git diff --quiet; then
                    echo "already on this widget - nothing to propose"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Update the lockfile
              if: steps.bump.outputs.changed == 'true'
              working-directory: web
              run: |
                  set -euo pipefail
                  pnpm install --lockfile-only --ignore-scripts

                  # `--lockfile-only` refreshes whatever else has drifted, not
                  # just this entry. A bump that quietly carries unrelated churn
                  # is not reviewable, so stop rather than propose it.
                  changed=$(git diff --name-only)
                  echo "$changed"
                  unexpected=$(echo "$changed" | grep -vE '^(apps/web/package\.json|pnpm-lock\.yaml)$' || true)
                  [ -z "$unexpected" ] || {
                    echo "install touched files beyond the dependency bump:"
                    echo "$unexpected"
                    echo "the lockfile has drifted from develop - update it there first"
                    exit 1
                  }
                  git diff --stat

            - name: Open the pull request
              if: steps.bump.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.vault.outputs.token }}
                  # Named explicitly rather than inferred from the remote, whose
                  # URL carries the token.
                  GH_REPO: eledrone/eledrone-web
                  TAG: ${{ needs.build.outputs.tag }}
                  SHORT_SHA: ${{ needs.build.outputs.short_sha }}
                  URL: ${{ steps.bump.outputs.url }}
                  SOURCE_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  cd web
                  branch="widget/${TAG}"

                  git config user.name "eledrone-call CI"
                  git config user.email "ci@eledrone.invalid"
                  git checkout -b "$branch"
                  git commit -am "build: element-call widget ${SHORT_SHA}

                  Built from eledrone-call@${SOURCE_SHA}."

                  # One branch per widget, so a re-run of the same commit updates
                  # its own PR instead of opening a second one.
                  git push --force-with-lease -u origin "$branch"

                  # An existing PR for this branch is left alone: the push above
                  # has already updated it.
                  if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                    echo "PR for $branch already open - updated it"
                    exit 0
                  fi

                  gh pr create --base develop --head "$branch" \
                    --title "build: element-call widget ${SHORT_SHA}" \
                    --body "Ships the Element Call widget built from [eledrone-call@\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}).

                  Tarball: <${URL}>

                  Opened automatically by eledrone-call's \`eledrone call embedded\` workflow. Merging is a judgement call: this is the widget that runs inside the desktop and web apps, so give the call UI a try on the preview before landing it."

            - name: Scrub the checkout, which holds the token in its remote URL
              if: always()
              run: rm -rf web secrets.json
